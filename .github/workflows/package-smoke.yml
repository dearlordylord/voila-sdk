name: Package Smoke

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-consumer:
    name: clean consumer (${{ matrix.package-manager }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 24.15.0
        package-manager:
          - pnpm
          - npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Effect dependency cohort
        run: pnpm verify:effect-cohort

      - name: Build packages
        run: pnpm build

      - name: Audit package contents
        run: pnpm package:audit

      - name: Install and execute packed packages in a clean consumer
        run: pnpm package:consumer-matrix -- --manager=${{ matrix.package-manager }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t voila-mcp:package-smoke .
